name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build Astro site for project Pages
        env:
          SITE_URL: https://sangtrx.github.io
          BASE_PATH: /sang-portfolio
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  notify-indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Notify IndexNow of canonical page updates
        env:
          INDEXNOW_KEY: 0b35f26e9c8b65fc18b0a63de6a7d930
          ORIGIN: https://sangtrx.github.io
          BASE_PATH: /sang-portfolio
        run: |
          cat > /tmp/indexnow.json <<EOF
          {
            "host": "sangtrx.github.io",
            "key": "${INDEXNOW_KEY}",
            "keyLocation": "${ORIGIN}${BASE_PATH}/${INDEXNOW_KEY}.txt",
            "urlList": [
              "${ORIGIN}${BASE_PATH}/",
              "${ORIGIN}${BASE_PATH}/about",
              "${ORIGIN}${BASE_PATH}/resume",
              "${ORIGIN}${BASE_PATH}/work/yhct",
              "${ORIGIN}${BASE_PATH}/work/curren"
            ]
          }
          EOF
          curl --fail-with-body --retry 3 --retry-all-errors \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data-binary @/tmp/indexnow.json \
            https://api.indexnow.org/indexnow
