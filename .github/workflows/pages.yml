name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build Astro site for canonical domain
        env:
          SITE_URL: https://sangtruong.me
          BASE_PATH: /
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  notify-indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Notify IndexNow of canonical page updates
        env:
          ORIGIN: https://sangtruong.me
        run: |
          INDEXNOW_KEY_FILE="$(find public -maxdepth 1 -type f -name '*.txt' -print -quit)"
          test -n "${INDEXNOW_KEY_FILE}"
          INDEXNOW_KEY="$(basename "${INDEXNOW_KEY_FILE}" .txt)"
          test "$(tr -d '\r\n' < "${INDEXNOW_KEY_FILE}")" = "${INDEXNOW_KEY}"

          cat > /tmp/indexnow.json <<EOF
          {
            "host": "sangtruong.me",
            "key": "${INDEXNOW_KEY}",
            "keyLocation": "${ORIGIN}/${INDEXNOW_KEY}.txt",
            "urlList": [
              "${ORIGIN}/",
              "${ORIGIN}/about",
              "${ORIGIN}/resume",
              "${ORIGIN}/yhct",
              "${ORIGIN}/work/yhct",
              "${ORIGIN}/work/curren"
            ]
          }
          EOF

          curl --fail-with-body --retry 3 --retry-all-errors \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data-binary @/tmp/indexnow.json \
            https://api.indexnow.org/indexnow
