name: Import encrypted YHCT atlas

on:
  push:
    branches: [feat/yhct-internal-archify-atlas]
    paths: [.github/workflows/yhct-internal-import.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect-transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Inspect encrypted transfer client endpoint
        env:
          SHARE_URL: https://firestorage.ai/ja/f/McTMlZBwcW80
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-all-errors "$SHARE_URL" -o /tmp/share.html
          python3 - <<'PY' > /tmp/page-js-url
          import re
          from pathlib import Path
          from urllib.parse import urljoin
          page = Path('/tmp/share.html').read_text('utf-8', errors='replace')
          scripts = re.findall(r'''src=["']([^"']+)["']''', page, re.I)
          matches = [urljoin('https://firestorage.ai', s) for s in scripts if '/app/(files)/ja/f/page-' in s]
          if len(matches) != 1:
              raise SystemExit(f'expected one share page bundle, got {matches}')
          print(matches[0])
          PY
          PAGE_JS="$(cat /tmp/page-js-url)"
          curl -fsSL --retry 3 --retry-all-errors "$PAGE_JS" -o /tmp/page.js
          python3 - <<'PY'
          import re
          from pathlib import Path
          js = Path('/tmp/page.js').read_text('utf-8', errors='replace')
          print(f'page_js_bytes={len(js.encode())}')
          terms = ('download', 'signed', 'presign', 'share', '/api/', 'files/', 'storage')
          for term in terms:
              print(f'contains_{term.replace("/", "_")}={term.lower() in js.lower()}')
          strings = re.findall(r'''["'`]([^"'`]{1,500})["'`]''', js)
          hits = []
          for s in strings:
              low = s.lower()
              if any(t in low for t in ('download', 'presign', '/api/', 'files/', 'share/')):
                  hits.append(s)
          seen=set()
          for s in hits:
              if s not in seen:
                  seen.add(s)
                  print('hit=' + s[:500])
          PY
