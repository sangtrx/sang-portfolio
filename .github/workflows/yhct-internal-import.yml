name: Import encrypted YHCT atlas

on:
  push:
    branches: [feat/yhct-internal-archify-atlas]
    paths: [.github/workflows/yhct-internal-import.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download, verify, and import encrypted bilingual atlas
        env:
          API_BASE: https://api.firestorage.ai/dev/file
          SHARE_ID: 9VjnFNj5guxb
          EXPECTED_ZIP_SHA256: 44a435d467bf7d6f1f009dd68a855b6850ae20befb66288c128d14835e94dcd9
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-all-errors \
            "$API_BASE/shares/$SHARE_ID/files?maxResults=1000" \
            -o /tmp/files.json

          python3 - <<'PY' > /tmp/file-id
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/files.json').read_text())
          files = data.get('files') or []
          if len(files) != 1:
              raise SystemExit(f'expected exactly one transfer file, got {len(files)}')
          item = files[0]
          file_id = item.get('fileId')
          if not file_id:
              raise SystemExit('missing fileId')
          print(file_id)
          PY

          FILE_ID="$(cat /tmp/file-id)"
          curl -fsSL --retry 3 --retry-all-errors -X POST \
            "$API_BASE/shares/$SHARE_ID/files/$FILE_ID/download" \
            -o /tmp/download.json

          python3 - <<'PY' > /tmp/download-url
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/download.json').read_text())
          url = data.get('downloadUrl')
          if not isinstance(url, str) or not url.startswith('https://'):
              raise SystemExit('missing valid downloadUrl')
          print(url)
          PY

          curl -fsSL --retry 3 --retry-all-errors "$(cat /tmp/download-url)" -o /tmp/yhct-atlas.zip
          echo "$EXPECTED_ZIP_SHA256  /tmp/yhct-atlas.zip" | sha256sum -c -

          rm -rf /tmp/yhct-atlas public/yhct-internal
          mkdir -p /tmp/yhct-atlas public/yhct-internal
          unzip -q /tmp/yhct-atlas.zip -d /tmp/yhct-atlas

          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('/tmp/yhct-atlas')
          expected = {'index.html', 'manifest.json', 'assets'}
          if {p.name for p in root.iterdir()} != expected:
              raise SystemExit(f'unexpected top-level payload: {[p.name for p in root.iterdir()]}')
          manifest = json.loads((root / 'manifest.json').read_text('utf-8'))
          if manifest.get('version') != 2:
              raise SystemExit(f'unexpected manifest version: {manifest.get("version")}')
          maps = manifest.get('maps') or []
          if len(maps) != 10:
              raise SystemExit(f'expected 10 maps, got {len(maps)}')
          files = sorted((root / 'assets').glob('map-*.enc'))
          if len(files) != 10:
              raise SystemExit(f'expected 10 encrypted map payloads, got {len(files)}')
          names = [p.name for p in files]
          if names != [f'map-{i:02d}.enc' for i in range(1, 11)]:
              raise SystemExit(f'unexpected encrypted payload names: {names}')
          notes = root / 'assets' / 'notes.enc'
          if not notes.is_file() or notes.stat().st_size < 1000:
              raise SystemExit('missing encrypted bilingual speaker notes')
          notes_meta = manifest.get('notes') or {}
          if notes_meta.get('file') != 'assets/notes.enc':
              raise SystemExit('manifest does not reference encrypted notes')
          public_text = (root / 'index.html').read_text('utf-8') + '\n' + (root / 'manifest.json').read_text('utf-8')
          banned = [
              'YHCT-Atlas-v1K6BQ2AGBsiS4YpjEw',
              'ffbe4d2a50832e0475a8e4543ed5c092a0a9990f',
              'big-linux',
              'tail71d60f',
          ]
          for term in banned:
              if term in public_text:
                  raise SystemExit(f'banned public metadata term found: {term}')
          if 'noindex,nofollow,noarchive' not in public_text:
              raise SystemExit('missing noindex metadata')
          if 'Tiếng Việt' not in public_text or 'English' not in public_text:
              raise SystemExit('missing bilingual presentation controls')
          if manifest.get('kdf', {}).get('iterations', 0) < 400000:
              raise SystemExit('KDF iterations below policy')
          if manifest.get('cipher') != 'AES-GCM-256':
              raise SystemExit('unexpected cipher')
          print('atlas_validation=10_maps_plus_bilingual_encrypted_notes_ok')
          PY

          cp -a /tmp/yhct-atlas/. public/yhct-internal/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/yhct-internal
          git diff --cached --check
          git commit -m 'feat: add bilingual internal YHCT architecture atlas'
          git push
