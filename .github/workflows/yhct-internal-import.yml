name: Import encrypted YHCT atlas

on:
  push:
    branches: [feat/yhct-internal-archify-atlas]
    paths: [.github/workflows/yhct-internal-import.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect-transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Locate encrypted transfer download API
        env:
          SHARE_URL: https://firestorage.ai/ja/f/McTMlZBwcW80
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-all-errors "$SHARE_URL" -o /tmp/share.html
          python3 - <<'PY'
          import re, subprocess
          from pathlib import Path
          from urllib.parse import urljoin, urlparse

          page = Path('/tmp/share.html').read_text('utf-8', errors='replace')
          scripts = [urljoin('https://firestorage.ai', s) for s in re.findall(r'''src=["']([^"']+)["']''', page, re.I)]
          scripts = [s for s in scripts if '/_next/static/chunks/' in s and s.endswith('.js')]
          print(f'script_count={len(scripts)}')
          out = Path('/tmp/chunks'); out.mkdir(exist_ok=True)
          for i, url in enumerate(scripts):
              path = out / f'{i:02d}-{Path(urlparse(url).path).name}'
              subprocess.run(['curl','-fsSL','--retry','3','--retry-all-errors',url,'-o',str(path)], check=True)
              text = path.read_text('utf-8', errors='replace')
              print(f'chunk={path.name} bytes={len(text.encode())}')
              contexts=[]
              for term in ('download','presign','signed','/api/','share','file_id','public_id'):
                  low=text.lower(); start=0
                  while True:
                      idx=low.find(term,start)
                      if idx<0: break
                      a=max(0,idx-180); b=min(len(text),idx+260)
                      contexts.append(text[a:b].replace('\n',' '))
                      start=idx+len(term)
              seen=set()
              for c in contexts:
                  if c not in seen:
                      seen.add(c)
                      print('context=' + c[:500])
          PY
