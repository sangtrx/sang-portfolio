name: Import encrypted YHCT atlas

on:
  push:
    branches: [feat/yhct-internal-archify-atlas]
    paths: [.github/workflows/yhct-internal-import.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect-transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Inspect temporary encrypted transfer share
        env:
          SHARE_URL: https://firestorage.ai/ja/f/McTMlZBwcW80
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-all-errors "$SHARE_URL" -o /tmp/share.html
          python3 - <<'PY'
          import html, re
          from pathlib import Path
          from urllib.parse import urljoin

          page = Path('/tmp/share.html').read_text('utf-8', errors='replace')
          print(f'share_html_bytes={len(page.encode())}')
          needles = ('download', '.zip', 'api/', 'file_id', 'public_id', 'storage')
          for needle in needles:
              print(f'contains_{needle.replace("/", "_").replace(".", "_")}={needle.lower() in page.lower()}')

          urls = set()
          for match in re.findall(r'''(?:href|src)=["']([^"']+)["']''', page, re.I):
              urls.add(urljoin('https://firestorage.ai', html.unescape(match)))
          for match in re.findall(r'https?://[^"\'<>\\s]+', page):
              urls.add(html.unescape(match))

          candidates = [u for u in sorted(urls) if any(k in u.lower() for k in ('download', 'api/', '.zip', 'storage'))]
          print(f'candidate_count={len(candidates)}')
          for u in candidates[:40]:
              print(f'candidate={u[:500]}')
          PY
